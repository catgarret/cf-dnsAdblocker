name: Update Cloudflare Gateway filter lists

on:
  schedule:
    # Daily at 03:17 UTC (12:17 KST). Upstream also has an open request
    # to move the default schedule from weekly to daily.
    - cron: "17 3 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-cf-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_ENV: production

jobs:
  cgps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current CGPS v1
        uses: actions/checkout@v6
        with:
          repository: mrrfv/cloudflare-gateway-pihole-scripts
          ref: v1

      - name: Install current Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Download allowlists
        run: npm run download:allowlist
        env:
          ALLOWLIST_URLS: ${{ vars.ALLOWLIST_URLS }}

      - name: Download blocklists
        run: npm run download:blocklist
        env:
          BLOCKLIST_URLS: ${{ vars.BLOCKLIST_URLS }}

      - name: Show generated list statistics
        shell: bash
        run: |
          echo "blocklist lines: $(wc -l < blocklist.txt 2>/dev/null || echo 0)"
          echo "allowlist lines: $(wc -l < allowlist.txt 2>/dev/null || echo 0)"
          du -h blocklist.txt allowlist.txt 2>/dev/null || true

      - name: Create or update Cloudflare Gateway rules and lists
        run: npm run cloudflare-create
        env:
          BLOCK_PAGE_ENABLED: ${{ vars.BLOCK_PAGE_ENABLED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_LIST_ITEM_LIMIT: ${{ secrets.CLOUDFLARE_LIST_ITEM_LIMIT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Send health-check ping
        if: ${{ success() && secrets.PING_URL != '' }}
        env:
          PING_URL: ${{ secrets.PING_URL }}
        run: curl --fail --show-error --silent --retry 3 --retry-delay 2 "${PING_URL}"

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Keep scheduled workflow active
        uses: liskin/gh-workflow-keepalive@v1
